<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Labo des personnages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>/* Layout: le jeu occupe tout l'écran. Toute l'interface est du papier : calepin, étiquettes, documents.
   Single-theme by choice: une nuit d'enquête, vue depuis un carnet d'inspecteur. */
:root{
  color-scheme:dark;
  --nuit:#0c0a1c; --encre:#141226; --stylo:#2a3a6a; --rouge:#a33a3a; --crayon:#ffd23f; --vert:#3d8a54;
  --papier:#eadcb8; --papier-2:#d8c79c; --craie:#f0ecdc;
  --r0:#7fe3d4;
  --f:"Pixelify Sans","Courier New",monospace;
  --main:"Patrick Hand","Comic Sans MS",cursive;
  --grain:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--nuit)}
body{color:var(--craie);font:17px/1.35 var(--f)}
.carnet>*,.pz>*,.pop>*,.doc>*,.bulle>*{zoom:var(--txt)}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#05040c;user-select:none;-webkit-user-select:none}
#jeu{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;touch-action:none;outline:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--stylo);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
.etiq:disabled{opacity:.5;cursor:not-allowed}

/* Étiquette de papier : le seul style de bouton du jeu */
.etiq{display:inline-flex;align-items:center;gap:6px;background:#f6ecd0 var(--grain);color:var(--encre);padding:4px 13px;min-height:34px;font:600 16px/1.1 var(--f);border:2px solid var(--stylo);
  border-radius:225px 18px 205px 16px/16px 205px 18px 225px;box-shadow:2px 3px 0 rgba(10,8,24,.45);transform:rotate(-.5deg);transition:transform .1s}
.etiq:nth-child(even){transform:rotate(.6deg)}
.etiq:hover,.etiq:focus-visible{background:#ffe9a0;transform:translateY(-2px) rotate(-1deg)}
.etiq:active{transform:translateY(1px)}
.etiq.fort{background:#c8483e;color:#fff4e0;border-color:#5a1420}
.etiq.fort:hover{background:#e0584c}
.etiq.alt{background:#d8c79c;color:#3a3048}
.etiq img{width:20px;height:20px;image-rendering:pixelated}
.ligne{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Sur la carte */
.lieu{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(max(10px,env(safe-area-inset-left,0px)) + var(--icone)*.72 + 10px);background:var(--papier) var(--grain);color:var(--encre);padding:2px 14px;font:600 17px var(--f);pointer-events:none;z-index:4;transform:rotate(-1.2deg);box-shadow:2px 3px 0 rgba(0,0,0,.5);clip-path:polygon(0 8%,4% 0,30% 6%,62% 0,100% 7%,98% 96%,70% 100%,35% 93%,3% 100%)}
:root{--icone:clamp(62px,11vmin,112px);--txt:1}
.hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud button{pointer-events:auto}
.calepin{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(var(--icone)*1.32);height:var(--icone);background-size:100% 100%;image-rendering:pixelated;transition:transform .12s}
.calepin:hover{transform:translateY(-5px)}
.calepin.frise{animation:frise .55s steps(6)}
@keyframes frise{0%,100%{transform:none}20%{transform:translateY(-10px) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}80%{transform:translateY(-6px) rotate(-3deg)}}
.engrenage{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));width:calc(var(--icone)*.72);height:calc(var(--icone)*.72)}
.engrenage i{position:absolute;inset:0;background-size:100% 100%;image-rendering:pixelated;display:block}
.engrenage:hover i{transform:rotate(18deg)}
.engrenage i{will-change:transform;transition:transform .2s}
.engrenage.tourne i{animation:tourne .7s cubic-bezier(.22,.8,.3,1)}
/* le petit pignon engrène le grand : il tourne en sens inverse, plus vite */
.engrenage #eng2{inset:auto;left:58%;top:58%;width:56%;height:56%}
.engrenage:hover #eng2{transform:rotate(-27deg)}
.engrenage.tourne #eng2{animation:tourne2 .7s cubic-bezier(.22,.8,.3,1)}
@keyframes tourne2{to{transform:rotate(-540deg)}}
/* calepin : la page se corne et se replie (dessinée par tournePage) */
.livret .feuille.page-vole{position:absolute;margin:0;pointer-events:none;flex:none}
.pli-page{position:absolute;pointer-events:none;z-index:3}
@keyframes tourne{to{transform:rotate(360deg)}}
.marteau{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:calc(var(--icone)*1.32);height:calc(var(--icone)*1.12)}
#mart{display:block;width:100%;height:100%;image-rendering:pixelated}
.plan-mini{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:grid;gap:2px;background:#eadcb8 var(--grain);padding:5px;box-shadow:3px 4px 0 rgba(0,0,0,.5);transform:rotate(.6deg);width:clamp(170px,20vw,260px)}
.plan-mini canvas{width:100%;display:block;background:#eadcb8}
.plan-mini span{font:600 calc(11px + .35vmin) var(--f);color:var(--encre);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.calme *{animation:none!important;transition:none!important}
.neuf{position:absolute;left:-6px;top:-6px;background:var(--crayon);color:var(--encre);min-width:26px;padding:0 5px;font-weight:700;box-shadow:0 0 0 2px var(--encre)}
.prompt{position:absolute;left:50%;bottom:calc(var(--icone) + 18px);transform:translateX(-50%);background:var(--papier) var(--grain);color:var(--encre);padding:2px 12px;font:600 17px var(--f);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:2px 3px 0 rgba(0,0,0,.5);z-index:4}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#f6ecd0 var(--grain);color:#8a2830;padding:4px 14px;font:600 17px var(--f);max-width:92%;text-align:center;pointer-events:none;box-shadow:2px 3px 0 rgba(0,0,0,.5);z-index:6}
.toast.bon{color:#1f6b45}

/* Bulles : un papier collé près du personnage */
.bulle,.amb{position:absolute;background:#fbf3dc var(--grain);color:var(--encre);z-index:7;border:3px solid var(--encre);box-shadow:3px 4px 0 rgba(0,0,0,.45)}
.bulle{width:min(540px,calc(100% - 24px));padding:10px 12px;font-size:19px;line-height:1.3;cursor:pointer;max-height:calc(100% - 20px);overflow-y:auto}
.bulle::after,.amb::after{content:"";position:absolute;left:var(--q,40px);bottom:-12px;width:14px;height:12px;background:#fbf3dc;border-right:3px solid var(--encre);border-bottom:3px solid var(--encre);transform:skewX(32deg)}
.bulle{overflow:visible}
.bulle.haut::after,.amb.haut::after{display:none}
.bulle .tete{display:flex;gap:10px;align-items:flex-start}
.bulle canvas{width:clamp(72px,13vmin,120px);height:clamp(72px,13vmin,120px);image-rendering:pixelated;flex:none;border:3px solid var(--encre)}
.bulle b{display:block;color:#8a2830;font-weight:700}
.bulle .suite{position:absolute;right:10px;bottom:4px;font-size:14px;color:#6a6a7a;animation:clign 1s steps(2) infinite}
@keyframes clign{50%{opacity:0}}
.bulle .choix{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;max-height:190px;overflow-y:auto;padding:3px}
.bulle .etiq{font-size:15px;min-height:30px;padding:2px 9px}
.amb{padding:2px 8px;font-size:15px;max-width:190px;pointer-events:none;z-index:3}

/* Cartons de scénario */
.carte{position:absolute;inset:0;background:#05040c;display:grid;place-content:center;justify-items:center;text-align:center;gap:12px;padding:24px;z-index:8;cursor:pointer}
.carte h2{font:700 clamp(2.2rem,7vw,4.5rem)/1 var(--f);color:var(--crayon);text-wrap:balance}
.carte p{font-size:clamp(1.1rem,2.6vw,1.6rem);max-width:30em;text-wrap:balance}
.carte small{color:#b8bcd4;font-size:15px}
.passer{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;background:#d8c79c var(--grain);color:#3a3048;padding:3px 12px;font:600 15px var(--f);border:2px solid var(--stylo);border-radius:225px 18px 205px 16px/16px 205px 18px 225px}

/* Le calepin : papier, spirale, marque-pages */
.carnet{position:absolute;inset:0;background:rgba(5,4,12,.66);display:grid;grid-template-rows:minmax(0,1fr);place-items:center;padding:12px 14px;z-index:6;overflow:hidden}
.livret{position:relative;width:min(900px,calc(100% - 140px));margin-right:112px;height:min(640px,calc(100vh - 28px));display:flex;min-height:0}
.spirale{flex:none;width:30px;background:repeating-linear-gradient(transparent 0 12px,#8a93a8 12px 18px,#d8dce4 18px 20px,transparent 20px 30px);margin-right:-13px;z-index:2}
.feuille{position:relative;flex:1;min-width:0;background:#eadcb8 var(--grain);background-size:64px;color:var(--encre);box-shadow:6px 8px 0 rgba(0,0,0,.5),inset 22px 0 18px -18px rgba(90,70,30,.5);padding:18px 18px 16px 34px;display:grid;grid-template-rows:minmax(0,1fr);border-radius:3px 8px 8px 3px}
.feuille::before{content:"";position:absolute;inset:0 0 0 0;pointer-events:none;background:repeating-linear-gradient(transparent 0 27px,rgba(70,90,150,.2) 27px 28px);border-radius:inherit}
.feuille::after{content:"";position:absolute;left:26px;top:0;bottom:0;width:2px;background:rgba(190,60,60,.4);pointer-events:none}
.corps{container-type:size;position:relative;overflow-y:auto;scrollbar-gutter:stable;min-height:0;padding:2px 34px 8px 6px;user-select:text;-webkit-user-select:text}
.croix{position:absolute;right:8px;top:8px;width:40px;height:40px;z-index:3;transition:transform .12s}
.croix:hover{transform:rotate(12deg) scale(1.15)}
.signets{position:absolute;left:100%;top:60px;display:flex;flex-direction:column;gap:6px;width:112px;z-index:1}
.signets button{background:var(--c);color:#fff8e8;font:600 14px var(--f);padding:6px 14px 6px 12px;text-align:left;width:94px;margin-left:-6px;box-shadow:2px 2px 0 rgba(0,0,0,.45);transition:width .1s;clip-path:polygon(0 0,100% 0,90% 50%,100% 100%,0 100%);text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.signets button:hover{width:102px}
.signets button{min-height:32px}
.signets button[aria-selected="true"]{width:112px}
.corps h2{font:700 1.6rem/1.15 var(--f);color:#8a2830;margin-bottom:8px;padding-right:30px}
.corps h3{font:600 1.15rem var(--f);color:var(--stylo);margin:12px 0 6px}
.main,.corps li,.corps textarea{font-family:var(--main);font-size:19px;line-height:1.25}
.main{margin-bottom:8px;color:#2a3a6a}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(150px,30cqw),1fr));gap:2cqw}
.case{background:#fff8e4;padding:7px;display:grid;gap:3px;align-content:start;text-align:left;box-shadow:0 0 0 2px var(--stylo),3px 3px 0 2px rgba(20,18,38,.25);font-family:var(--main);font-size:17px;line-height:1.15;min-height:96px;color:var(--encre)}
.case:nth-child(odd){transform:rotate(-.7deg)}
.case:nth-child(3n){transform:rotate(.8deg)}
.case .t{display:flex;align-items:center;gap:6px;font:700 15px var(--f);color:#8a2830}
.case img{width:clamp(30px,7cqw,52px);height:clamp(30px,7cqw,52px);image-rendering:pixelated;flex:none}
.case.k-temoin .t{color:var(--stylo)}
.case.k-doc{background:#fbe7d0}
.fiche-t{display:flex;gap:10px;padding:8px 0;border-bottom:2px dashed rgba(42,58,106,.35)}
.fiche-t img{width:clamp(56px,13cqw,110px);height:clamp(56px,13cqw,110px);image-rendering:pixelated;flex:none;border:2px solid var(--stylo)}
.fiche-t>div{flex:1;min-width:0}
.fiche-t h3{margin:0 0 2px}
.fiche-t ul{margin:0;padding-left:18px}
.fiche-t .vide{font-family:var(--main);color:#7a6a54}
.fiche-t textarea{width:100%;margin-top:4px;background:transparent;border:0;border-bottom:1px solid rgba(42,58,106,.45);color:var(--stylo);resize:vertical;outline:none}
.gens{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(140px,30cqw),1fr));gap:2cqw;margin-bottom:10px}
.fiche{display:flex;flex-direction:column;gap:6px;padding:2cqw;background:#fff8e4;text-align:left;min-width:0;align-items:flex-start;font-size:15px;line-height:1.2;color:var(--encre);box-shadow:0 0 0 2px var(--stylo)}
button.fiche:hover{background:#ffe9a0}
.fiche img{height:min(25cqh,20cqw);width:auto;aspect-ratio:1;align-self:center;image-rendering:pixelated;flex:none}
.fiche.choisi{box-shadow:0 0 0 4px #a33a3a;background:#ffd8c8}
.fiche b{display:block;font-size:17px}
.fiche em{color:var(--stylo);font-style:normal;font-weight:600}
.fiche .tr{color:#8a5a14}
.fiche .mb{color:#a33a3a}
.objets,.papiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(100px,22cqw),1fr));gap:2cqw}
.objet-c,.pap{display:grid;justify-items:center;gap:3px;padding:7px;background:#fff8e4;box-shadow:0 0 0 2px var(--stylo);font:600 14px/1.1 var(--f);text-align:center;color:var(--encre)}
button.objet-c:hover,.pap:hover{background:#ffe9a0}
.objet-c img,.pap img{width:clamp(40px,12cqw,84px);height:clamp(40px,12cqw,84px);image-rendering:pixelated}
#croquis{max-width:100%;background:transparent;display:block}

/* Documents : le papier est dessiné en pixels, le texte vient par-dessus */
.doc{position:absolute;inset:0;background:rgba(5,4,12,.8);display:flex;padding:14px;z-index:8;overflow:auto}
.vue{position:relative;margin:auto;max-width:100%}
.vue>.croix{position:fixed;right:14px;top:14px;background:#f6ecd0;border-radius:50%;box-shadow:2px 2px 0 rgba(0,0,0,.45);z-index:3}
.d{--t:"VT323","Courier New",monospace;position:relative;box-sizing:border-box;color:#1c1826;font:400 20px/1.14 var(--t);background-size:100% 100%;image-rendering:pixelated;filter:drop-shadow(6px 8px 0 rgba(0,0,0,.5));padding:44px 46px 40px;display:flex;flex-direction:column;gap:7px;user-select:text;-webkit-user-select:text}
.d p,.d ol,.d table{margin:0}
.d i{font-style:normal;color:#5a4a3a}
.d h4{font:700 27px/1.1 var(--f);text-align:center;margin:4px 0}
.d h5{font:700 17px/1.1 var(--f);margin:5px 0 0;border-bottom:2px solid #5a4a3a;padding-bottom:1px;color:#3a2a2a}
.d .ent{font:600 15px/1.2 var(--f);letter-spacing:.04em;text-align:center;color:#4a3a2a}
.d .ent.cl{color:#fff4d8;font-size:21px;margin-top:-30px}
.d .ent.cl2{color:#ecdcb0;font-size:13px;margin-top:-5px;margin-bottom:12px}
.d .ent.dr{text-align:right;padding-left:64px;font-size:19px;color:#1f5a44}
.d .ent small{font:400 13px var(--f)}
.d .fort{font:700 26px var(--f);text-align:center}
.d .signe{font-family:var(--main);font-size:30px;line-height:1;text-align:right;color:var(--stylo);margin-top:auto;padding-right:90px}
.d .signe.g{padding-right:0;text-align:left}
.d .petit{font-size:17px;color:#5a4a3a}
.d .c{text-align:center}
.d .main{font-family:var(--main);font-size:23px;margin:0}
.d .marge{font-family:var(--main);font-size:24px;line-height:1.1;color:#a33a3a}
.d .marge.haute{position:absolute;right:40px;top:372px;width:190px;transform:rotate(-4deg)}
.d .pied{font-size:16px;color:#5a4a3a;border-top:1px solid #8a7a5a;padding-top:3px}
.d .ecrit{font:400 23px/1.2 var(--main);color:#2a3a6a;display:flex;flex-direction:column;gap:8px}
.d .ecrit ol{padding-left:26px}
.d ol{padding-left:24px}
.d .ligne2{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.d .ent2 p:last-child{text-align:right}
.d .ent2{font-size:17px;border-bottom:3px double #2a3a6a;padding-bottom:5px}
.d mark{background:#ffe45c;color:#1a1626;padding:0 3px;box-shadow:inset 0 -2px 0 #e8b820}
.d table.reg{border-collapse:collapse;width:100%;font-size:18px}
.d table.reg td,.d table.reg th{border:1px solid #6a5a48;padding:2px 6px;text-align:left;font-weight:400}
.d .titre-j{font:700 56px/1 Georgia,"Times New Roman",serif;text-align:center;margin-top:-8px;padding-bottom:18px}
.d .sous-j{display:flex;justify-content:space-between;font-size:17px;margin-top:-14px;padding:2px 4px;border-top:3px solid #141226;border-bottom:3px double #141226}
.d .cols{display:grid;grid-template-columns:428px 1fr;gap:38px;flex:1}
.d .cols .t2{font:700 19px var(--f);margin-top:14px;border-top:1px solid #6a6a72;padding-top:6px}
.d .cols p+p{margin-top:8px}
.d .cote{padding-top:150px;font-size:17px}
.d .cote b{display:block;font:700 15px var(--f);margin-top:6px}
.d .ph{display:none}
.d .colle{line-height:1.7}
.colle span{display:inline-block;padding:1px 6px;margin:2px;background:#fff;box-shadow:1px 1px 0 rgba(0,0,0,.3);font-size:22px}
.colle .m0{font:700 25px Georgia,serif;transform:rotate(-3deg)}
.colle .m1{background:#1a1a1a;color:#fff;transform:rotate(2deg);font-family:var(--t)}
.colle .m2{font:700 28px Impact,sans-serif;background:#f4d84a;transform:rotate(1deg)}
.colle .m3{font:400 23px "Courier New",monospace;background:#e8b0a8;transform:rotate(-2deg)}
.d .fiche-c{position:absolute;left:40px;right:40px;bottom:68px;font-size:18px}
.d .fiche-c b{font:700 14px var(--f)}
.d .fiche-c mark{font-size:18px}
.d[data-k=chantage]{padding:24px 26px}
.d[data-k=recu]{padding:30px 22px;gap:3px;font-size:19px}
.d[data-k=recu] .l{display:flex;justify-content:space-between}
.d[data-k=recu] .tir{overflow:hidden;white-space:nowrap}
.d[data-k=telegramme]{padding:28px 30px}
.d[data-k=telegramme] .ent.cl{margin-top:-20px;margin-bottom:12px}
.d .cases{display:grid;grid-template-columns:repeat(5,1fr);font-size:18px;text-align:center;margin-top:-2px}
.d .cases i{display:block;font:600 13px var(--f)}
.d .bande{font-size:25px;line-height:66px;margin-top:0;text-transform:uppercase;padding:0 14px;height:190px;overflow:hidden}
.d[data-k=registre]{padding:32px 34px}
.d[data-k=registre] .ent.cl{margin-top:-20px;margin-bottom:18px}
.d table.led{border-collapse:collapse;width:100%}
.d table.led th{font:700 15px var(--f);text-align:left;padding:0 8px 8px}
.d table.led td{padding:0 8px;height:42px}
.d table.led td.h{font:400 22px var(--main);color:#2a3a6a}
.d[data-k=registre] .pied{margin-top:auto}
.d table.heures{border-collapse:collapse;margin:10px 0 0 -22px;width:calc(100% + 22px)}
.d table.heures td{height:45px;vertical-align:middle;font:400 23px var(--main);color:#2a3a6a;padding:0 6px}
.d table.heures td:first-child{width:92px;text-align:right;font:400 19px var(--t);color:#7a2228;padding-right:14px}
.d[data-k=agenda] .bas{margin-top:auto;color:#2a3a6a}
.d[data-k=agenda]{padding:30px 22px 22px 40px}
.d[data-k=journal]{padding:30px 34px 30px 88px;line-height:1.1}
.d[data-k=journal] .ecrit{font-size:26px;line-height:36px;gap:0;margin-top:16px}
.d[data-k=journal] .petit{margin-top:6px}
.d[data-k=carte] .dem{position:absolute;left:28px;top:36px;width:300px;font-size:24px;line-height:1.15;color:#2a3a6a}
.d[data-k=carte] .dest{position:absolute;left:385px;top:194px;width:300px;line-height:45px;font:400 25px var(--main);color:#2a3a6a}
.d[data-k=carte] .obl{position:absolute;right:120px;top:120px;font-size:15px;transform:rotate(-8deg);color:#3a3a4a}
.d[data-k=renvoi]{padding-top:32px}
.d[data-k=dette]{padding-top:34px}
.d[data-k=dette] h4{text-align:left;padding-right:84px}
.d[data-k=brevet]{padding:38px 48px}
.d[data-k=brevet] .ent{margin-top:0}
.d[data-k=article]{padding:26px 28px}
.d[data-k=contrat]{padding-top:42px}
.d[data-k=contrat] ol.art{display:flex;flex-direction:column;gap:6px}
.d[data-k=autopsie]{padding:44px 40px 34px;font-size:19px;gap:5px}
.d[data-k=autopsie] .signe{padding-right:0;text-align:left;margin-top:30px}
.d[data-k=ordonnance]{padding:34px 34px 30px}
.d[data-k=ordonnance] .ordo{margin-top:30px}
.d[data-k=ordonnance] .ecrit{margin:14px 0;font-size:26px}
.d[data-k=testament]{padding:42px 48px 36px}
.tampon-p{position:absolute;right:124px;bottom:28px;width:144px;height:144px;border:4px double #2a3a8a;border-radius:50%;color:#2a3a8a;display:grid;place-content:center;justify-items:center;text-align:center;transform:rotate(-13deg);opacity:.76;mix-blend-mode:multiply}
.tampon-p b{font:700 21px/1 var(--f)}
.tampon-p small{font:600 12.5px/1.15 var(--f)}
.objet{background:#f4ead0 var(--grain);display:grid;justify-items:center;text-align:center;width:min(380px,100%);color:#1a1626;padding:24px;gap:8px;box-shadow:6px 8px 0 rgba(0,0,0,.5);font:600 17px/1.3 var(--f)}
.objet h4{font:700 1.4rem var(--f)}
.objet img{width:252px;height:252px;max-width:100%;image-rendering:pixelated}
.objet .petit{font-size:14px;color:#5a4a3a}
.objet .main{font-size:20px}

/* Énigmes et mini-jeux : une fiche de papier */
.pz{position:absolute;inset:0;background:rgba(5,4,12,.74);display:grid;place-items:center;padding:12px;z-index:7}
.fiche-pz{width:min(800px,100%);max-height:100%;overflow-y:auto;padding:18px;display:grid;gap:11px;justify-items:center;text-align:center;background:#eadcb8 var(--grain);color:var(--encre);box-shadow:6px 8px 0 rgba(0,0,0,.5);font-size:18px}
.fiche-pz h3{font:700 1.5rem var(--f);color:#8a2830}
.clue{display:grid;gap:3px;font-family:var(--main);font-size:20px}
.code{letter-spacing:.22em;font:700 1.25em var(--f);color:var(--stylo)}
.fiche-pz input[type=text]{font-size:1.3em;background:#fff8e4;color:var(--encre);border:2px solid var(--stylo);padding:4px 8px;width:220px;max-width:100%;text-align:center}
.fiche-pz input[type=range]{width:min(320px,100%)}
.mono{word-break:break-word;max-width:60ch;color:var(--stylo);font:600 18px "Courier New",monospace}
.pgrid{display:grid;gap:3px;justify-content:center}
.pgrid button{width:46px;height:46px;background:#c8b888;font-size:20px;line-height:1;color:var(--encre);box-shadow:inset 0 0 0 2px var(--stylo)}
.pgrid button.on{background:var(--crayon)}
.pgrid button.x{visibility:hidden}
.pgrid svg,.pgrid img{display:block;width:100%;height:100%;image-rendering:pixelated}
.pgrid .proche{background:#d8483e}.pgrid .moyen{background:#e0a03a}.pgrid .loin{background:#5a7ad8}
.err{color:#a33a3a;min-height:1.2em}
.meuble{position:relative;display:block;margin:0 auto;width:min(760px,100%,calc((100vh - 190px)*1.6));aspect-ratio:320/200;background-size:100% 100%;image-rendering:pixelated;box-shadow:0 0 0 4px #2a1a14;overflow:hidden}
.meuble img{display:block;width:100%;height:auto;image-rendering:pixelated}
.cintre{position:absolute;top:8%;width:20%;transform-origin:50% 0;transition:transform .15s}
.cintre:hover,.cintre:focus-visible{transform:rotate(3deg);z-index:2}
.cintre.vu{transform:translateY(-2%) rotate(-5deg);filter:brightness(.55)}
.rayon{position:absolute;left:22%;width:56%;bottom:16%;display:flex;align-items:flex-end;justify-content:center}
.rayon button{width:15.5%;transition:transform .12s}
.rayon button:hover{transform:translateY(-3%)}
.rayon .sel{transform:translateY(-8%);filter:brightness(1.3)}
.serrure{position:absolute;left:14%;right:14%;top:56%;display:grid;justify-items:center;gap:6px}
.gp{display:flex;gap:10px}
.gp i{width:16px;height:16px;border-radius:50%;background:#2a1a14;box-shadow:inset 0 0 0 2px #d8b050}
.gp i.ok{background:#58d67a}
.tir{width:100%;height:clamp(18px,5cqw,30px);position:relative;background:#2a2230;box-shadow:0 0 0 3px #d8b050}
.tir i{position:absolute;top:0;bottom:0;background:var(--vert)}
.tir u{position:absolute;top:-5px;bottom:-5px;width:6px;background:var(--crayon);box-shadow:0 0 0 1px var(--encre)}
.boite{position:absolute;width:16%;transition:transform .12s}
.boite:hover{transform:translateY(-4%)}
.tatons{position:absolute;inset:7% 6%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:2px}
.tatons button{background:transparent;transition:background .12s}
.tatons button:hover{background:rgba(255,255,255,.14)}
.tatons .proche{background:rgba(216,72,62,.62)}.tatons .moyen{background:rgba(224,160,58,.5)}.tatons .loin{background:rgba(90,122,216,.42)}
.cendres{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:grab}
.cendres.hd{image-rendering:auto;cursor:pointer}

/* Page d'accueil */
.accueil{position:absolute;inset:0;z-index:10;overflow:auto}
#ciel{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.acc-ui{position:relative;min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:24px;align-items:center;padding-block:24px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));user-select:none}
.acc-g{display:grid;gap:18px;justify-items:start;max-width:520px}
.acc-g h1{font:700 clamp(3.6rem,11vw,7.5rem)/.88 var(--f);color:var(--craie);text-shadow:4px 5px 0 #05040c}
.acc-g h1 span{color:var(--crayon)}
.acc-g>p{font-size:clamp(1.05rem,2.2vw,1.35rem);max-width:26em;text-shadow:2px 2px 0 #05040c}
.acc-g .etiq{font-size:19px;min-height:44px;padding:6px 18px}
.pop{position:absolute;inset:0;background:rgba(5,4,12,.74);display:grid;place-items:center;padding:12px;z-index:20}
.opts{position:relative;width:min(760px,100%);text-align:left;justify-items:stretch}
.opts .croix{right:8px;top:8px}
.opts h3{padding-right:40px}
.opts h4{font:600 1.1rem var(--f);color:var(--stylo)}
.lignes{display:grid;gap:7px}
.opt{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:10px;align-items:center;font:600 15px var(--f)}
.opt input[type=range]{width:100%}
.etiq.actif{background:#2a3a6a;color:#fff4e0}
@media (max-width:560px){.opt{grid-template-columns:minmax(0,1fr)}}
.acc-d{position:relative;background:#c8b48a var(--grain);padding:16px;box-shadow:6px 8px 0 rgba(0,0,0,.55);transform:rotate(.7deg);color:var(--encre)}
.tampon{position:absolute;right:-10px;top:-18px;background:#f6ecd0 var(--grain);border:4px solid #a33a3a;color:#a33a3a;padding:3px 13px;display:grid;justify-items:center;transform:rotate(7deg);z-index:1;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
.tampon b{font:700 2rem/1 var(--f)}
.tampon span{font:600 13px var(--f)}
.dossiers{display:grid;gap:5px;margin-top:40px}
.dossier{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;background:#f0dfae var(--grain);padding:5px 10px;text-align:left;box-shadow:1px 2px 0 rgba(60,40,10,.55);font:600 16px var(--f);overflow:hidden}
.dossier:nth-child(even){background-color:#e6d09a}
.dossier:hover{background:#ffe9a0;transform:translateX(-4px)}
.dossier .no{color:#8a2830}
.dossier .dif{font-size:13px;color:#6a5a44}
.dossier i{position:absolute;right:62px;top:3px;font:700 15px var(--f);font-style:normal;color:#a33a3a;border:2px solid #a33a3a;padding:0 5px;transform:rotate(-7deg);background:rgba(246,236,208,.7)}
@media (max-width:820px){
  .acc-ui{grid-template-columns:minmax(0,1fr);align-content:start}
  .livret{width:100%;height:100%;flex-direction:column}
  .spirale{display:none}
  .signets{position:static;order:-1;flex-direction:row;flex-wrap:wrap;width:auto;gap:3px}
  .signets button,.signets button:hover,.signets button[aria-selected="true"]{width:auto;margin:0;padding:3px 9px;clip-path:none;font-size:13px}
  .signets button[aria-selected="true"]{outline:2px solid #fff8e8}
  .feuille{padding-left:30px}
}
@media (max-width:560px){
  body{font-size:16px}
  .bulle canvas{width:60px;height:60px}
  .bulle{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.calepin.frise,.bulle .suite{animation:none}}

/* Tribunal : une parade d'identification plein écran, avec toise et banc d'accusation */
.tribunal{position:absolute;inset:0;z-index:15;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:clamp(6px,2vh,16px);padding:clamp(10px,3vh,26px) max(16px,env(safe-area-inset-right,0px));color:#f0ecdc;
  background:repeating-linear-gradient(transparent 0 calc(10vh - 2px),rgba(240,236,220,.16) calc(10vh - 2px) 10vh),linear-gradient(#1a1f3a,#0c0f22)}
.tribunal>header{text-align:center}
.tribunal>header p{font:600 15px var(--f);letter-spacing:.12em;text-transform:uppercase;color:#b8bcd4}
.tribunal>header h2{font:700 clamp(1.5rem,4.4vh,2.6rem)/1.1 var(--f);color:var(--crayon)}
.alignes{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:clamp(6px,1.4vw,18px);align-items:center;align-content:center;min-height:0;max-width:1100px;width:100%;margin:0 auto}
.aligne{position:relative;display:grid;justify-items:center;gap:3px;padding:8px 6px 10px;color:#f0ecdc;background:rgba(240,236,220,.06);transition:transform .12s,background .12s;min-width:0}
.aligne:hover{background:rgba(240,236,220,.14);transform:translateY(-5px)}
.aligne .no{position:absolute;left:6px;top:4px;background:#141226;color:var(--crayon);font:700 14px var(--f);padding:0 6px}
.aligne img{width:100%;max-height:44vh;object-fit:contain;image-rendering:pixelated}
.aligne b{font:700 clamp(15px,2.4vh,20px)/1.1 var(--f)}
.aligne small{font:400 clamp(12px,1.8vh,15px)/1.1 var(--f);color:#b8bcd4;text-align:center}
.aligne i{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg);font:700 clamp(15px,2.8vh,24px) var(--f);font-style:normal;color:#ff6a5e;border:3px solid #ff6a5e;padding:0 8px;background:rgba(20,10,20,.72);opacity:0}
.aligne.choisi{background:rgba(216,72,62,.26);box-shadow:inset 0 0 0 3px #ff6a5e}
.aligne.choisi i{opacity:1}
.tribunal>footer{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:center;background:linear-gradient(#5f2f1a,#3a1c10);box-shadow:inset 0 3px 0 #d8a840,0 -4px 0 rgba(0,0,0,.4);padding:clamp(8px,1.8vh,14px) 18px;margin-inline:calc(-1*max(16px,env(safe-area-inset-right,0px)));margin-bottom:calc(-1*clamp(10px,3vh,26px))}
.tribunal>footer p{font:600 clamp(15px,2.4vh,19px) var(--f);min-width:0}
.frapper{display:inline-flex;align-items:center;gap:10px;background:#c8483e;color:#fff4e0;font:700 clamp(16px,2.6vh,21px) var(--f);padding:6px 18px;box-shadow:3px 4px 0 rgba(0,0,0,.45)}
.frapper:hover:not(:disabled){background:#e0584c}
.frapper:disabled{background:#6a4a48;color:#c8b8b0;cursor:not-allowed}
#trib-mart{width:60px;height:51px;image-rendering:pixelated}
.croix.claire{right:14px;top:12px;background:#f6ecd0;border-radius:50%;z-index:2}
@media (max-width:640px){.alignes{grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;overflow-y:auto}.aligne img{max-height:18vh}}

/* Intérieur des meubles */
.scene-c{display:block;margin:0 auto;width:min(760px,100%,calc((100vh - 190px)*1.6));aspect-ratio:320/200;image-rendering:pixelated;touch-action:none;cursor:grab;box-shadow:0 0 0 4px #2a1a14}
.scene-c:active{cursor:grabbing}
/* Emploi du temps dessiné à la main dans le calepin */
.edt-wrap{overflow-x:auto}
.edt{border-collapse:collapse;width:100%;table-layout:fixed;font-family:var(--main);color:#1a1626;background:rgba(255,252,240,.5)}
.edt th,.edt td{border:2px solid #2a3a6a;padding:3px 3px;vertical-align:middle;text-align:center;font-weight:400;background:none}
.edt thead th{font:700 16px var(--f);color:#2a3a6a}
.edt thead th:first-child{width:clamp(70px,17cqw,120px)}
.edt tbody th{text-align:left;font:600 clamp(13px,2.2cqw,15px) var(--f);color:#1a1626;overflow:hidden}
.edt tbody th img{width:clamp(18px,4.4cqw,30px);height:auto;image-rendering:pixelated;vertical-align:middle;margin-right:5px}
.edt td b{display:block;font-weight:400;font-size:clamp(13px,2.7cqw,18px);line-height:1.05;color:#2a3a6a}
.edt td small{font-size:clamp(12px,2.4cqw,16px);line-height:1.05;color:#4a3a2a;display:block}
.edt td i{font-style:normal;color:#9a8a6a;font-size:18px}
.edt .crime{background:rgba(216,72,62,.2)}
.edt thead .crime{color:#c82a20;background:rgba(216,72,62,.3)}
.corps textarea{width:100%;margin-top:8px;background:transparent;border:0;border-bottom:1px solid rgba(42,58,106,.45);color:var(--stylo);resize:vertical;outline:none;font:19px var(--main)}
.carnet .croix{right:26px;top:6px}

/* Dossier d'accusation : arme et heure, facultatives */
.dossier-acc{display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:center;max-width:1100px;width:100%;margin:0 auto}
.dossier-acc>div{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px;min-width:0}
.dossier-acc b{font:700 clamp(14px,2.2vh,17px) var(--f);color:var(--crayon)}
.dossier-acc span{display:flex;flex-wrap:wrap;gap:4px}
.dossier-acc .etiq{font-size:clamp(12px,1.9vh,15px);padding:2px 8px}
.dossier-acc .etiq.actif{background:#d8483e;color:#fff4e0}

/* Carte : le nom de la pièce au survol */
.plan-nom{position:absolute;right:0;top:calc(100% + 6px);background:#141226;color:#fff8e8;font:700 clamp(17px,2.6vw,24px)/1.1 var(--f);padding:5px 12px;white-space:nowrap;box-shadow:3px 3px 0 rgba(0,0,0,.5);transform:rotate(-.6deg);pointer-events:none}
/* Déductions et note de fin */
.deduc{display:flex;flex-wrap:wrap;gap:10px}
.tcol{flex:1 1 150px;min-width:0;display:grid;gap:5px;align-content:start}
.tcol h3{margin:0}
.tem{display:grid;text-align:left;background:#f6ecd0;color:var(--encre);padding:5px 8px;box-shadow:inset 0 0 0 1px var(--stylo);font:400 16px/1.1 var(--main)}
.tem b{font:600 14px var(--f)}
.tem.reg{background:#e8d8b0}
.tem.sel{background:#ffe45c;box-shadow:inset 0 0 0 2px #c8483e}
.liens{list-style:none;padding:0;display:grid;gap:4px;font:400 18px/1.2 var(--main)}
.liens li{padding-left:18px;position:relative}
.liens li::before{content:"=";position:absolute;left:0;color:#3a7a4c;font-weight:700}
.liens li.rouge{color:#a32a2a}
.liens li.rouge::before{content:"X";color:#c8302a}
.note-fin{display:flex;gap:16px;align-items:center;margin:6px 0}
.lettre{flex:none;width:76px;height:76px;display:grid;place-items:center;font:700 52px/1 var(--f);border:4px solid currentColor;transform:rotate(-7deg)}
.l-A,.l-B{color:#2e7a4a}.l-C,.l-D{color:#b87a1a}.l-E{color:#a32a2a}
.petitp{font:400 16px var(--main);color:#5a4a3a}
/* Nouveaux mini-jeux */
.ecrits{position:absolute;inset:6% 5%;display:grid;grid-template-columns:1fr 1.5fr;gap:3%;min-height:0}
.modele,.quatre button{background:#f4ead0;color:#1a1626;box-shadow:2px 3px 0 rgba(0,0,0,.4);padding:6px 8px;text-align:left;display:grid;align-content:start;gap:2px;min-width:0;overflow:hidden}
.modele b,.quatre b{font:600 13px var(--f);color:#5a4a3a}
.quatre{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:0}
.quatre .vu{opacity:.45}
.ecrit{display:block;font-size:clamp(15px,2.6cqw,21px);line-height:1.2;transform-origin:0 50%}
.meuble{container-type:inline-size}
.emp{position:absolute;inset:6% 5%;display:flex;gap:5%;align-items:center;justify-content:center}
.emp>div:first-child,.fiches button{background:#f4ead0;color:#1a1626;padding:6px;display:grid;justify-items:center;gap:3px;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
.emp b{font:600 13px var(--f)}
.emp img{width:clamp(56px,16cqw,110px);image-rendering:pixelated}
.fiches{display:flex;gap:8px}
.fiches img{width:clamp(44px,12cqw,84px)}
/* Niveau test : une seule ligne discrète, le reste se joue dans le décor */
.but{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(560px,62vw);background:rgba(10,8,20,.74);color:#f0ecdc;font:600 clamp(13px,1.9vh,16px)/1.2 var(--f);padding:4px 12px;text-align:center;pointer-events:none;z-index:4;text-wrap:balance}
.salles{list-style:none;padding:0;display:grid;gap:6px}
.salles li{display:grid;gap:3px;background:#fff8e4;padding:6px 10px;box-shadow:2px 2px 0 rgba(0,0,0,.2);font:400 17px/1.15 var(--main)}
.salles b{font:600 16px var(--f)}
.salles .fini b{color:#2e7a4a}
/* Écran tactile */
#jeu,#mini,.scene-c,.cendres{touch-action:manipulation}
@media (max-width:560px){
  .plan-mini{width:118px;padding:3px}
  .plan-mini span#ici{font-size:11px}
  .ecrits{grid-template-columns:1fr}
  .edt th,.edt td{padding:2px}
}
@media (pointer:coarse){
  .etiq{min-height:40px}
  .tons .etiq,.fl .etiq{min-height:38px}
}
#mini{pointer-events:auto}
@media (max-width:640px){
  .tribunal{overflow-y:auto;grid-template-rows:auto auto auto auto}
  .alignes{overflow:visible}
  .tribunal>footer{position:sticky;bottom:0;z-index:2}
}
/* Tutoriel : quelques mots, une flèche, et c'est au joueur d'agir */
.tuto-p{position:absolute;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,8,20,.6);color:#c8c4d8;font:600 12px var(--f);padding:2px 9px;z-index:4}
.tuto-p:hover{color:#fff}
.calepin.appel,.marteau.appel{animation:appel .9s ease-in-out infinite}
@keyframes appel{0%,100%{transform:scale(1)}50%{transform:scale(1.14) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.calepin.appel,.marteau.appel{animation:none;outline:3px solid #ffd23f}}
/* Fins et enquête du jour */
.fin-nom{display:grid;gap:2px;background:#2a2430;color:#f0ecdc;padding:7px 12px;margin:4px 0}
.fin-nom b{font:700 19px var(--f);color:#ffd23f}
.fin-nom span{font:400 18px/1.15 var(--main)}
.dossier.jour{background:#8a2830;color:#fff4e0}
.dossier.jour .no,.dossier.jour .dif{color:#ffd23f}
.tampon small{display:block;font-size:12px}
/* ——— Petits écrans ———
   Règles pensées d'abord pour un téléphone : rien ne dépasse sur les côtés, tout défile en hauteur,
   et chaque bouton se touche au doigt sans zoomer. */
.pz,.pop{display:flex;overflow-y:auto;overscroll-behavior:contain}
.pz>*,.pop>*{margin:auto;max-width:100%}
.carnet,.doc,.accueil,.tribunal,.pz,.pop{overscroll-behavior:contain}
.plan-mini span#ici{font-size:max(13px,calc(11px + .35vmin))}
.tuto-p{font-size:14px;padding:4px 10px}
.tampon small{font-size:13px}
.opt input[type=range]{height:32px}
@media (pointer:coarse){
  .bulle .etiq,.dossier-acc .etiq{min-height:40px}
  .signets button{min-height:38px}
}
@media (max-width:820px){
  .signets button,.signets button:hover,.signets button[aria-selected="true"]{min-height:36px;padding:6px 11px;font-size:15px}
  .livret{width:100%;margin-right:0}
  .feuille{padding:14px 12px 12px 24px}
  .feuille::after{left:16px}
  .carnet{padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}

.cpt-code{display:flex;justify-content:center;gap:12px;margin:6px 0}.cpt-code i{width:18px;height:18px;border-radius:50%;border:3px solid #2a3a8a}.cpt-code i.plein{background:#2a3a8a}
.cpt-pave{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}.cpt-pave button{font-size:1.3rem;min-height:48px}
.cpt-texte{width:100%;height:120px;font:12px/1.3 monospace;background:#fff8e4;color:var(--encre);border:2px solid rgba(42,58,106,.4);padding:6px;word-break:break-all;resize:vertical}
@media (max-width:560px){.cpt-photo img{width:88px;height:88px}.carte-cpt img{width:44px;height:44px}.cpt-pave{grid-template-columns:repeat(3,58px)}}

.ed-modeles{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px}
.ed-modeles button{padding:3px;display:grid;justify-items:center;gap:2px;font-size:10px;line-height:1.1}
.ed-modeles img{height:44px;max-width:100%;object-fit:contain;image-rendering:pixelated}
.ed-modeles.larges{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}.ed-modeles.larges img{height:34px}
.ed-champ{display:grid;gap:3px;font-size:12px}

/* ——— Fiches des suspects : dossier de police ——— */
.tetes{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.tete{flex:1 0 74px;max-width:120px;display:grid;justify-items:center;gap:2px;padding:6px 4px;background:#fff8e4;color:var(--encre);box-shadow:2px 2px 0 rgba(0,0,0,.2);border-bottom:4px solid transparent}
.tete img{width:56px;height:56px;image-rendering:pixelated;background:#2a3a5a;border:2px solid #2a2418}
.tete b{font:700 15px var(--f)}.tete small{font:500 11.5px var(--f);color:#5a4a30}.tete .alerte{color:#a33a3a;font-style:normal;font-weight:700}
.tete.choisi{border-bottom-color:#8a2830;background:#fff3cf}.tete:hover{background:#fff3cf}
.dossier-s{background:#f6ecd0 var(--grain);box-shadow:3px 4px 0 rgba(0,0,0,.25);padding:12px 14px;display:grid;gap:8px;border-left:10px solid #c8a468;position:relative}
.dossier-s header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:2px solid rgba(42,36,24,.25);padding-bottom:8px}
.dossier-s header img{width:96px;height:96px;image-rendering:pixelated;background:#2a3a5a;border:3px solid #2a2418;flex:none}
.ds-id{display:grid;gap:2px;flex:1;min-width:150px}.ds-id small{font:500 12px var(--f);color:#5a4a30;letter-spacing:.04em;text-transform:uppercase}
.ds-id b{font:700 1.45rem/1.1 var(--f);color:#2a2418}.ds-id span{font:500 15px var(--f)}.ds-id em{font:700 14px var(--f);color:var(--stylo);font-style:normal}
.ds-tampon{font:700 15px var(--f);font-style:normal;color:#2a3a8a;border:3px double #2a3a8a;padding:3px 10px;transform:rotate(-6deg);text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.ds-tampon.rouge{color:#a33a3a;border-color:#a33a3a}
.ds-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.ds-grille section{background:rgba(255,248,228,.7);padding:6px 9px;box-shadow:1px 1px 0 rgba(0,0,0,.12)}
.dossier-s h4{font:700 1rem var(--f);color:#8a2830;margin:2px 0}.dossier-s h4 small{font:500 12px var(--f);color:#5a4a30}
.dossier-s p{font:500 14.5px/1.25 var(--f);margin:2px 0}
.ds-jauge{height:9px;background:rgba(42,36,24,.2);border-radius:4px;overflow:hidden;margin:4px 0}.ds-jauge i{display:block;height:100%;background:linear-gradient(90deg,#58a65a,#e8c040 55%,#c8382a)}
.ds-heures{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:5px}
.ds-heures li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;background:#fff8e4;padding:5px 8px;border-left:4px solid #2a3a8a;font:500 14px var(--f)}
.ds-heures li b{font:700 15px var(--f);color:#2a3a8a}.ds-heures li small{display:block;font-size:12.5px;color:#5a4a30}
.ds-heures li.vide{opacity:.6;border-left-color:#8a8478}.ds-heures li.vide span{font-style:italic}
.ds-heures li.crime{border-left-color:#a33a3a;background:#fbe9dc}.ds-heures li.crime b{color:#a33a3a}
.ds-cloche{margin:0;padding-left:18px}.ds-cloche li{font:600 14.5px/1.25 var(--f);color:#a33a3a;margin:2px 0}
.ds-rien{color:#5a4a30;font-style:italic}.ds-mobile{color:#a33a3a;font-weight:700}
@media (max-width:520px){.dossier-s header img{width:72px;height:72px}.dossier-s{padding:10px}.tete{flex-basis:66px}.tete img{width:46px;height:46px}}

/* ——— Menu de construction : bois et papier ——— */
.ed-barre{background:linear-gradient(#5a3a22,#3a2414);border-bottom:3px solid #c8983a;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.ed-barre button,.ed-barre select{background:linear-gradient(#f4e8c8,#d8c49a);color:#2a1c10;border:1px solid #8a6a3a;box-shadow:0 2px 0 #2a1c10}
.ed-barre button:hover{background:linear-gradient(#fff4d8,#e8d4a8)}
.ed-barre button[aria-pressed="true"]{background:linear-gradient(#ffd86a,#e0a830);border-color:#6a4410}
.ed-barre button.fort{background:linear-gradient(#8ad89a,#4a9a5a);color:#0a2010}
.ed-outils button{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 4px}.ed-outils img{width:26px;height:26px;image-rendering:pixelated;background:rgba(42,28,16,.15);border-radius:3px}
.ed-panneau{background:#efe3c4 var(--grain);color:#2a1c10;border-left:3px solid #c8983a}
.ed-panneau .ed-aide{color:#5a4224;background:rgba(255,248,228,.7);padding:6px 8px;border-left:3px solid #c8983a}
.ed-panneau .petit{color:#6a5434}.ed-panneau h3{color:#8a2830}
.ed-panneau button{background:#fff8e4;color:#2a1c10;border:1px solid #c8b088;box-shadow:1px 1px 0 rgba(0,0,0,.15)}
.ed-panneau button:hover{background:#fff1c8}.ed-panneau button.pris{background:#ffd86a;border-color:#8a6a2a}
.ed-panneau button.danger{background:#f2c8c0;border-color:#a8404a;color:#5a1010}
.ed-panneau .ed-cherche,.ed-panneau input[type=number]{background:#fff8e4;color:#2a1c10;border:1px solid #c8b088}
.ed-titre{font:700 13px system-ui;color:#8a2830;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.ed-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:4px}
.ed-cats button{display:grid;justify-items:center;gap:2px;padding:4px 2px;font-size:11px}.ed-cats img{height:30px;max-width:100%;object-fit:contain;image-rendering:pixelated}
.ed-palette.recents{grid-template-columns:repeat(auto-fill,minmax(56px,1fr))}.ed-palette.recents span{display:none}.ed-palette.recents img{height:38px}
.ed-palette button{background:#fff8e4}
.ed-etat{background:#2a1c10;border-top:3px solid #c8983a}

/* Niveau test des points de vue */
.dossier.essai{background:#2a3a6a;color:#fff4e0}
.dossier.essai .no,.dossier.essai .dif{color:#ffd23f}
.vues{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:15;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:center;background:rgba(20,16,36,.85);padding:5px 8px;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.5);max-width:calc(100% - 140px)}
.vues span{color:#ffd23f;font:600 13px var(--f)}
.vues .etiq{font-size:13px;padding:4px 9px}
</style>

function makeDocs(c,r){
  const V=c.vName,set=c.set,date=()=>pick(r,JOURS),nomOf=i=>c.suspects[i].nom,out=[];
  c.suspects.forEach((su,i)=>out.push({k:su.dk,t:DOC_TITRES[su.dk],s:i,p:{v:V,n:su.nom,date:date(),m:(12+int(r,60))*1000,lieu:set.nom,mob:su.mobile||''}}));
  // Faits vrais : uniquement des déclarations de personnes qui disent la vérité
  const menteurs=c.tueurs;
  const sures=c.needed.filter(i=>i.t==='s'&&!menteurs.includes(i.s));
  range(c.n).forEach(s=>{if(!menteurs.includes(s))range(c.H).forEach(h=>sures.push({t:'s',s,h}))});
  const vus=new Set(),faits=[];
  sures.forEach(i=>{const k=i.s+'-'+i.h;if(!vus.has(k)&&!c.stmts[i.s][i.h].vic){vus.add(k);faits.push(i)}});
  const room=i=>set.rooms[c.stmts[i.s][i.h].room],avec=i=>c.stmts[i.s][i.h].with;
  const f1=faits[0],f2=faits[1],f3=faits[2];
  if(f1)out.push({k:'agenda',t:'Page d\'agenda',fact:f1,p:{n:c.suspects[f1.s].prenom,date:date(),h:HOURS[f1.h],room:room(f1).n,noms:avec(f1).map(i=>c.suspects[i].prenom)}});
  if(f2)out.push({k:'recu',t:'Note de service',fact:f2,p:{n:nomOf(f2.s),h:HOURS[f2.h],room:room(f2).n,lieu:set.nom,no:100+int(r,800),m:6+int(r,40)}});
  if(f3&&c.key!=='facile')out.push({k:'journal',t:'Page de journal',fact:f3,p:{v:V,date:date(),txt:`Ce soir, ${c.suspects[f3.s].prenom} était ${room(f3).d} à ${HOURS[f3.h]}, je l'ai noté comme tout le reste.`}});
  // Un seul papier d'ambiance par affaire, pour ne pas noyer les vrais indices
  const ambiance=pick(r,['telegramme','ordonnance','carte']);
  if(ambiance==='telegramme')  out.push({k:'telegramme',t:'Télégramme',p:{v:V,date:date(),txt:pick(r,['MEFIEZ VOUS STOP QUELQU UN ICI VOUS EN VEUT STOP DETRUISEZ CE MESSAGE STOP','AFFAIRE NON REGLEE STOP ARRIVE CE SOIR STOP NE PARLEZ A PERSONNE STOP'])}});
  if(ambiance==='ordonnance')out.push({k:'ordonnance',t:'Ordonnance',p:{n:nomOf(int(r,c.n)),date:date(),no:1000+int(r,8000),med:pick(r,['Somnifère léger, un comprimé au coucher.','Calmant, deux gouttes le soir.','Sirop pour la toux, trois fois par jour.'])}});
  if(ambiance==='carte')out.push({k:'carte',t:'Carte postale',p:{v:V,lieu:set.nom,txt:pick(r,["Tout va bien ici. N'oublie pas ce que tu m'as promis. Je reviendrai réclamer mon dû.","Il fait beau, mais je pense à notre dispute. Il faudra bien en reparler."])}});
  return out;
}

function RNG(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const int=(r,n)=>Math.floor(r()*n);
const pick=(r,a)=>a[int(r,a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=int(r,i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const range=n=>Array.from({length:n},(_,i)=>i);
const form=(s,g)=>{const p=s.split('|');return p.length>1&&g==='f'?p[1]:p[0]};

function otherRoom(r,excl){let x;do{x=int(r,NR)}while(excl.includes(x));return x}

function attempt(r,lv,modeJeu){
  const set=LV(lv),key=modeJeu==='expert'?'expert':set.diff,d=DIFF[key],H=HOURS.length,n=d.n;
  const hc=1+int(r,H-1),rc=int(r,NR),k=int(r,n);
  const inn=shuffle(r,range(n).filter(i=>i!==k));
  const [X,Y,W,Z,x]=inn;
  const pos=range(n).map(()=>{
    const row=[];let cur=int(r,NR);
    for(let h=0;h<H;h++){
      if(h===0||r()>.45)cur=int(r,NR);
      if(h>=hc&&cur===rc)cur=otherRoom(r,[rc]);
      row.push(cur);
    }

  const n=(a,b,s)=>noise(X*16+a,Y*16+b,s);

  if(kind==='parquet'||kind==='planche'||kind==='scene'){
    const base=kind==='parquet'?'#8a5a34':kind==='planche'?'#7a6143':'#3a2b2a';

      const row=((Y*16+b)/5)|0,off=noise(row,7,3)*48|0,pl=((X*16+off)/32)|0,v=noise(row,pl,5);

        if((Y*16+b)%5===4)P(tone(base,-.5),a,b);
        else if((X*16+a+off)%32===0)P(tone(base,-.46),a,b);

    }
  }else if(kind==='damier'){
    for(let b=0;b<16;b++)for(let a=0;a<16;a++){

      let c=tone(base,(n(a,b,1)-.5)*.08);

      else if((a+b)%8===1&&(a%8)<3)c=tone(c,.22);
      P(c,a,b);
    }
  }else if(kind==='tapis'){
    for(let b=0;b<16;b++)for(let a=0;a<16;a++){
      const x=X*16+a,y=Y*16+b,mo=(Math.abs((x%24)-12)+Math.abs((y%24)-12));

      const x=X*16+a,y=Y*16+b,v=Math.sin(x*.21+y*.13+6*noise(x>>3,y>>3,4));

      if(x%32===0||y%32===0)c='#7a7682';
      P(c,a,b);
    }
  }else if(kind==='pierre'||kind==='terre'){
    const base=kind==='pierre'?'#6a625a':'#5a4634';
    for(let b=0;b<16;b++)for(let a=0;a<16;a++){
      const x=X*16+a,y=Y*16+b,cx=(x/10|0),cy=(y/10|0),jx=(x+(cy&1)*5)%10,jy=y%10;
      const edge=jx===0||jy===0,v=noise(cx+(cy&1)*3,cy,6);
      let c=tone(base,(v-.5)*.36+(n(a,b,8)-.5)*.1);
      if(edge)c=tone(base,-.55);else if(jx===1||jy===1)c=tone(c,.13);
      if(kind==='terre'&&!edge&&n(a,b,3)>.96)c='#5e8c4a';
      P(c,a,b);
    }
  }else if(kind==='metal'){
    for(let b=0;b<16;b++)for(let a=0;a<16;a++){
      const x=X*16+a,y=Y*16+b;let c=tone('#5a636e',(n(a,b,2)-.5)*.06);
      if(((x+y)%6===0)&&((x-y+60)%6===0))c='#7d8794';else if(((x+y)%6===0)&&((x-y+60)%6===3))c='#454d58';
      if(a===0||b===0)c='#2f353e';if(a===1||b===1)c='#717b88';
      if((a===3||a===12)&&(b===3||b===12))c='#a6b0bd';
      P(c,a,b);
    }
  }else if(kind==='lino'){
    for(let b=0;b<16;b++)for(let a=0;a<16;a++){
      let c=tone('#a9b8b4',(n(a,b,2)-.5)*.1);if(n(a>>1,b>>1,7)>.92)c='#8d9c9c';
      if(a===15||b===15)c='#7d8b8b';P(c,a,b);
    }
  }else if(kind==='sport'){

      const x=X*16+a,y=Y*16+b;let c=tone('#27507e',(n(a,b,2)-.5)*.14);
      if((x%64)<2||(y%48)<2)c='#e8d36a';P(c,a,b);
    }
  }else{ // beton
    for(let b=0;b<16;b++)for(let a=0;a<16;a++){
      const v=n(a,b,2),s=noise((X*16+a)>>3,(Y*16+b)>>3,3);

      if((X*16+a)%48===0||(Y*16+b)%48===0)c='#54585c';
      P(c,a,b);
    }
  }
}

function wallColumn(g,x,y,tint,lamb){
  for(let b=0;b<32;b++)for(let a=0;a<16;a++){
    const X=x+a,Y=y+b;let c;
    if(b<3)c=tone(tint,-.55+.12*b);
    else if(b<19){
      const m=(Math.abs((X%12)-6)+Math.abs(((Y+(X%24<12?0:6))%12)-6));
      c=tone(tint,m===4?.13:m<2?.2:(noise(X,Y,2)-.5)*.05);
      if(X%24===0)c=tone(tint,-.14);
    }else if(b<21)c=tone(lamb,.34-.2*(b-19));
    else if(b<29){
      const p=X%24;c=tone(lamb,(noise(X>>2,Y,4)-.5)*.12);
      if(p===0||p===23||b===21||b===28)c=tone(lamb,-.34);else if(p===1||b===22)c=tone(lamb,.2);
    }else c=b===29?tone(lamb,.2):tone(lamb,-.5);
    R(g,c,X,Y);
  }
}

// Photo de journal : une scène en gris, tramée comme à l'impression
function photoJ(acc,s){
  if(typeof document==='undefined')return'';
  const[k,g]=cv(96,64),gris=['#2a2620','#5a554a','#8a8474','#bab4a0','#e8e2d0'];
  const lum=(x,y)=>{
    if(acc){
      let l=.12+y/64*.18;
      if(y>30-Math.sin(x*.07)*4-(x>60?6:0))l=.1;
      const rx=48+Math.sin(y*.06)*18-(64-y)*.3,lw=6+y*.32;if(y>30&&Math.abs(x-rx)<lw)l=.5+(Math.abs(x-rx)<1&&y%6<3?.4:0);
      for(let t=0;t<5;t++){const px=70+t*5,py=36+t*4;if(x===px&&y>=py-5&&y<=py)l=t===2?.15:.8}
      if(Math.abs(x-30)+Math.abs(y-50)*1.8<12&&y>44)l=.04;
      if((x-21)*(x-21)+(y-49)*(y-49)<5)l=1;if(x<21&&x>4&&Math.abs(y-49)<(21-x)*.3)l=Math.max(l,.72);
      [[10,22],[18,26],[86,24]].forEach(([a,b])=>{if(y>b-10&&y<b+6&&Math.abs(x-a)<(y-b+10)*.35)l=.06});
      return l;
    }
    let l=.1;if(y>44)l=.35;
    if(x<20||x>76)l=.24+((x%6)<2?.1:0);
    const sp=Math.abs(x-48)<(y-4)*.28&&y<46;if(sp)l=.62+(46-y)/46*.25;
    if(Math.abs(x-48)<4&&y>28&&y<46||(x-48)*(x-48)+(y-25)*(y-25)<10)l=.05;
    if(y>52&&((x%9)-4)*((x%9)-4)+(y-56)*(y-56)*.7<14)l=.04;
    return l;
  };
  for(let y=0;y<64;y++)for(let x=0;x<96;x++){const q=Math.max(0,Math.min(.999,lum(x,y)))*4,b=Math.floor(q);R(g,gris[Math.min(4,b+(q-b>bay(x,y)?1:0))],x,y)}
  return k.toDataURL();
}

  const vide=(X,Y)=>X>=0&&Y>=0&&X<PW&&Y<PH&&t[Y>>4][X>>4]===0&&!own[Y*PW+X];

// ——— Le calepin : on tourne la page comme on corne une feuille ———
// Le coin du bas se soulève et se replie : on voit l'envers du papier, son ombre sur la page,

// La vie des personnages dans le jeu. Chacun a son caractère (tiré de sa voix, de son métier, de son âge,

  [/biblioth|écriv|professeu|journal|notaire|libraire|secrétaire|comptable|avocat|archiv/i,{lire:2},'a toujours un livre en main'],
  [/pian|music|chant|artiste|comédien|acteur|actrice|danseu|peintre/i,{piano:3,tableau:1.5},'aime la musique et les tableaux'],
  [/médecin|infirm|docteur|chirurg|pharmac/i,{heure:1.6},'surveille l\'heure'],
  [/jardin|capitaine|marin|pilote|guide|alpin|météo/i,{fenetre:1.8},'regarde souvent dehors'],
  [/gardien|veilleur|contrôleur|détective|vigile|concierge|chef de|directeu|directrice/i,{ailleurs:2.2,attendre:.6},'fait sa ronde de pièce en pièce']];

  // emploi du temps déclaré

    const crime=c.win.includes(k)?' crime':'';

    const st=c.stmts[i][k],avec=st.with.map(t=>c.suspects[t].prenom);if(st.vic)avec.push(c.vName);
    return`<li class="${crime.trim()}"><b>${h}</b><span>${esc(cap(c.set.rooms[st.room].n))}<small>${avec.length?'avec '+esc(liste(avec)):(su.g==='f'?'seule':'seul')}</small></span></li>`}).join('');

// Cases libres qu'on ne peut pas atteindre (enfermées par des murs ou des meubles) et meubles sans accès

    l.forEach(([x,y])=>{const k=x+','+y;if(comp.has(k))return;const st=[[x,y]];comp.set(k,n);let t=1;while(st.length){const[a,b]=st.pop();for(const[p,q]of[[1,0],[-1,0],[0,1],[0,-1]]){const X=a+p,Y=b+q,K=X+','+Y;if(!libre(X,Y)||comp.has(K))continue;comp.set(K,n);t++;st.push([X,Y])}}tailles.push(t);n++});

// ——— Aides de placement ———
function edOccupe(sauf){const o=new Map();W.furn.forEach(f=>{if(f.ci===sauf)return;for(let a=0;a<f.h;a++)for(let b=0;b<f.w;b++)o.set((f.y+a)*MW+f.x+b,f.ci)});return o}
function edDevantPortes(){const s=new Set();Object.values(W.doors).forEach(d=>{const l=d.v?[[d.x-1,d.y],[d.x-1,d.y+1],[d.x+1,d.y],[d.x+1,d.y+1]]:[[d.x,d.y-1],[d.x+1,d.y-1],[d.x,d.y+3],[d.x+1,d.y+3]];l.forEach(([x,y])=>s.add(y*MW+x))});(W.entrees||[]).forEach(e=>{for(let k=0;k<2;k++)s.add((e.y+2)*MW+e.x+k)});return s}
function edLibre(n,x,y,sauf){
  const dp=edDevantPortes(),[fw,fh]=FP[n],o=edOccupe(sauf),ai=W.areas.findIndex(A=>A.rects.some(q=>x>=q.x0&&x<=q.x1&&y>=q.y0&&y<=q.y1));if(ai<0)return false;const A=W.areas[ai];
  for(let a=0;a<fh;a++)for(let b=0;b<fw;b++){const X=x+b,Y=y+a;if(!W.t[Y]||W.t[Y][X]!==1||W.gate[Y][X]||o.has(Y*MW+X)||dp.has(Y*MW+X)||!A.rects.some(q=>X>=q.x0&&X<=q.x1&&Y>=q.y0&&Y<=q.y1))return false}
  return true;
}
// la rangée du haut d'un mur du fond, si la case (x,y) est sur un mur
function edHautMur(x,y){if(!W.t[y]||W.t[y][x]!==2)return null;while(y>0&&W.t[y-1][x]===2)y--;return W.t[y+1]&&W.t[y+1][x]===2?y:null}

  const surCase=L.find(f=>p.x>=f.x*TS&&p.x<(f.x+f.w)*TS&&p.y>=f.y*TS&&p.y<(f.y+f.h)*TS);if(surCase)return surCase.ci;
  const surDessin=L.find(f=>p.x>=f.x*TS-1&&p.x<(f.x+f.w)*TS+1&&p.y>=(f.y+f.h)*TS-SH[f.name]-1&&p.y<(f.y+f.h)*TS);if(surDessin)return surDessin.ci;
  const CU=edCarte(),i=ED.hors.find(i=>{const[n,x,y]=CU.furn[i],[fw,fh]=FP[n]||[1,1];return p.x>=x*TS&&p.x<(x+fw)*TS&&p.y>=y*TS&&p.y<(y+fh)*TS});return i??null;
}
function edIcone(n){let k=ED.icones.get(n);if(!k){const[fw,fh]=FP[n];k=furnitureSprite({name:n,x:0,y:0,w:fw,h:fh,v:7,room:0});ED.icones.set(n,k)}return k}
const edVariantes=n=>{const b=n.replace(/[BLR]$/,'');return[b,b+'L',b+'R',b+'B'].filter((k,i,a)=>FP[k]&&SPR[k]&&a.indexOf(k)===i)};

// ——— Souris et doigts ———
function edPointe(e){

  const pan=()=>{ED.drag={pan:true,sx:e.clientX,sy:e.clientY,cx0:ED.cx,cy0:ED.cy}};

    ED.sel={meuble:i};const[n,x,y]=CU.furn[i];ED.drag={meuble:i,nom:n,ox:cx-x,oy:cy-y,x,y,x0:x,y0:y,ok:true};edPanneau();edDessine();return;

      i=j;cote=Math.abs(fx-q[0])<bord?'g':Math.abs(fx-q[0]-q[2])<bord?'d':Math.abs(fy-q[1])<bord?'h':Math.abs(fy-q[1]-q[3])<bord?'b':null;break}

    ED.sel={porte:d.id};ED.drag={porte:d.id,pos:[d.x,d.y],d};edDessine();return;
  }
  if(O_==='sol'){const a=W.areas.findIndex(A=>A.rects.some(q=>cx>=q.x0&&cx<=q.x1&&cy>=q.y0&&cy<=q.y1));if(a<0)return pan();ED.sel={aire:a};edPanneau();edDessine();return}

      if(i>=0){ED.sel={fen:i};edPanneau();edDessine()}else if(W.t[y][cx+1]===2){edModifie(C=>C.fen.push([cx,y,ED.fenT]));ED.sel={fen:edCarte().fen.length-1};edPanneau()}else{ED.msg='Une fenêtre fait deux cases de large.';edEtat()}}
    else{const i=CU.tab.findIndex(([x,yy,n])=>yy===y&&cx>=x&&cx<x+(TAB_ETROITS.includes(n)?2:4));

function edBouge(e){

function edLache(e){

  }
  if(D.rect!=null){
    const q=D.q,q0=D.q0;if(q.every((v,i)=>v===q0[i])){edDessine();return}
    const nr=edCarte().plan.r.length,dx=q[0]-q0[0],dy=q[1]-q0[1],deplace=!D.cote;

      Object.values(C.portes).forEach(p=>{if(dedans(p[0]-1,p[1])||dedans(p[0]+1,p[1])||dedans(p[0],p[1]-1)){p[0]+=dx;p[1]+=dy}});
    },true);
    return;
  }
  if(D.porte!=null){const d=D.d;if(D.pos[0]===d.x&&D.pos[1]===d.y){edDessine();return}edModifie(C=>{C.portes[d.a+'-'+d.b]=D.pos.slice()});
    const n=W.doors[D.porte];if(n&&(n.x!==D.pos[0]||n.y!==D.pos[1])){ED.msg='La porte reste là où le mur commun le permet.';edEtat()}return}

  else{let h=-1,yh=0,bas=-1;for(let k=1;k<=3&&h<0;k++){const i=aireEn(cx,cy-k);if(i>=0){h=i;yh=cy-k}}for(let k=1;k<=3&&bas<0;k++){const i=aireEn(cx,cy+k);if(i>=0)bas=i}
    if(h>=0&&bas>=0&&h!==bas){a=h;b=bas;pos=[cx,yh+1]}}
  if(a<0)return false;
  if(Object.values(W.doors).some(q=>(q.a===a&&q.b===b)||(q.a===b&&q.b===a))){ED.msg='Ces deux pièces ont déjà une porte : glisse-la pour la déplacer.';edEtat();return true}
  const na=W.areas[a].name,nb=W.areas[b].name;
  const ok=edModifie(C=>{C.liens=[...(C.liens||[]),[na,nb]];const noms=edNomsAires(C);C.portes=C.portes||{};C.portes[noms.indexOf(na)+'-'+noms.indexOf(nb)]=pos},true);
  if(ok){ED.msg='Porte ajoutée entre « '+na+' » et « '+nb+' ».';edEtat()}
  return true;
}

// ——— Grade : des points pour chaque enquête, chaque bonne note, chaque fin découverte ———
const PTS_NOTE={A:8,B:5,C:3,D:1};
function points(s){
  let p=10*(s.gagnees||0);
  Object.values(s.notes||{}).forEach(n=>p+=PTS_NOTE[n]||0);
  Object.values(s.exp||{}).forEach(n=>p+=15+(PTS_NOTE[n]||0));
  p+=5*Object.keys(s.fins||{}).length+2*Object.keys(s.jours||{}).length;
  return p;
}
const GRADES=[[0,'Stagiaire','Stagiaire'],[30,'Inspecteur','Inspectrice'],[80,'Inspecteur principal','Inspectrice principale'],[160,'Commissaire','Commissaire'],
  [280,'Commissaire divisionnaire','Commissaire divisionnaire'],[450,'Directeur de la PJ','Directrice de la PJ'],[700,'Légende du Quai','Légende du Quai']];
function grade(s,f){
  const p=points(s);let i=0;while(i+1<GRADES.length&&p>=GRADES[i+1][0])i++;
  const a=GRADES[i][0],b=GRADES[i+1]?GRADES[i+1][0]:a;
  return{nom:GRADES[i][f?2:1],suivant:GRADES[i+1]?GRADES[i+1][f?2:1]:null,p,part:b>a?(p-a)/(b-a):1,manque:b-p};
}

function cptFinEnquete(ok){
  const avant=new Set(insignesDe(stats)),n=S.fin.note||{};
  stats.hist=[{t:Date.now(),lv:S.lv,mode:S.mode||'',win:ok,n:n.l,min:n.min,ai:n.ai||0,tr:n.tr,tot:n.tot,jour:!!S.jour},...(stats.hist||[])].slice(0,40);

async function codeTransfert(){

  let b=new TextEncoder().encode(JSON.stringify(d)),pre='FA1-';
  if(window.CompressionStream){try{const s=new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'));b=new Uint8Array(await new Response(s).arrayBuffer());pre='FA2-'}catch(e){}}
  let bin='';for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode(...b.subarray(i,i+8192));
  return pre+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function litCode(code){

  let b=Uint8Array.from(atob(b64+'==='.slice((b64.length+3)%4)),ch=>ch.charCodeAt(0));
  if(pre==='FA2-'){const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));b=new Uint8Array(await new Response(s).arrayBuffer())}
  const d=JSON.parse(new TextDecoder().decode(b));if(d.f!=='FA'||!d.stats)throw new Error('contenu');return d;
}

// ——— Fouille d'une caisse : rien n'est signalé, c'est à toi de repérer ce qui détonne ———
function openCaisse(o){
  const fam=o.name==='trunk'?'trunk':'crate',s=(o.id*13+c.seed)%9973,[fk,fg]=cv(SCENE_W,SCENE_H),q0=o.loot;
  const Sc=remplitCaisse(fam,s,icone(q0.t==='obj'?q0.id:q0.t==='cle'?'cle':'lettre'));
  fondCaisse(fg,fam,s);
  PZ=null;G.mini=null;pzOpen();son('page');
  $('pz').innerHTML=`<div class="fiche-pz"><h3>${esc(cap(NOM_F[o.name]||'La caisse'))}</h3><p id="sc-m">Sors ce qu'il y a là-dedans. Quelque chose n'a sûrement rien à faire ici.</p><canvas id="sc" class="scene-c" width="${SCENE_W}" height="${SCENE_H}"></canvas><div class="ligne"><button class="etiq alt" data-x="ferme">Refermer</button></div></div>`;
  const k=$('sc'),dit=t=>{$('sc-m').textContent=t};
  let prise=null,mx=0,my=0,bouge=0,attente=0;
  const pos=e=>{const q=k.getBoundingClientRect();return[(e.clientX-q.left)/q.width*SCENE_W,(e.clientY-q.top)/q.height*SCENE_H]};
  // Un clic pose l'objet à côté de la caisse
  const sort=q=>{const g0=q.x+q.w/2<SCENE_W/2,cote=g0?-q.w*.35:SCENE_W-q.w*.65;q.tx=cote+int(Math.random,18)-9;q.ty=Math.max(-6,Math.min(SCENE_H-q.h+6,q.y+int(Math.random,40)-20))};
  k.addEventListener('pointerdown',e=>{
    const[x,y]=pos(e);try{k.setPointerCapture(e.pointerId)}catch(_){}
    for(let i=Sc.o.length-1;i>=0;i--){const q=Sc.o[i];if(touche(q,x,y)){prise=q;mx=x-q.x;my=y-q.y;bouge=0;q.tx=q.ty=undefined;Sc.o.splice(i,1);Sc.o.push(q);dit(q.nom);return}}
    const t=Sc.t;if(x>=t.x+2&&x<t.x+t.w-2&&y>=t.y+2&&y<t.y+t.h-2){Sc.pris=true;G.pzT=null;ouvreBoite(o)}
  });
  k.addEventListener('pointermove',e=>{if(!prise)return;const[x,y]=pos(e);bouge+=Math.abs(x-mx-prise.x)+Math.abs(y-my-prise.y);prise.x=x-mx;prise.y=y-my});
  k.addEventListener('pointerup',()=>{if(!prise)return;if(bouge<5)sort(prise);prise=null});
  G.pzT=()=>{
    if(!$('sc'))return;
    Sc.o.forEach(q=>{if(q.tx!==undefined){q.x+=(q.tx-q.x)*.2;q.y+=(q.ty-q.y)*.2}});
    if(tick%20===0&&Sc.vus().length>=Sc.total)attente+=20;
    if(attente>360)Sc.brille=true;
    dessineScene(k,fk,Sc,tick);
  };
  Sc.total=Math.floor(Sc.t.w*Sc.t.h/16*.8);
  dessineScene(k,fk,Sc,tick);
}

function botGoals(){
  const o=[];
  for(const i of c.needed){
    if(i.t==='s'&&!S.asked[i.s+'-'+i.h])o.push({o:W.obj.find(q=>q.kind==='suspect'&&q.s===i.s),h:i.h});
    if(i.t==='r'&&!S.seenRooms[i.room])o.push({o:W.obj.find(q=>q.kind==='vitrine'&&q.room===i.room)});
  }
  return o;
}
function botKeys(){
  const o=[];
  Object.values(W.doors).forEach(d=>{if(d.lock!==null&&!S.open[d.id]&&S.cles[d.lock])o.push({o:d})});
  W.obj.forEach(q=>{if(q.kind==='fouille'&&!S.open[q.id]&&q.loot&&q.loot.t==='cle')o.push({o:q})});
  return o;
}
function botAct(g){
  const o=g.o;
  if(o.kind==='suspect')apprendre(o.s,g.h);
  else if(o.kind==='vitrine')inspecter(o.room);
  else if(o.kind==='door')S.open[o.id]=1;
  else{S.open[o.id]=1;if(o.loot.t==='cle')S.cles[o.loot.i]=1}
  G.bgoal=null;
}
function botAccuse(){
  const known={stm:(s,h)=>!!S.asked[s+'-'+h],room:r=>!!S.seenRooms[r]},w=solve(c,known),pistes=new Set(w.map(x=>x.L.join()));
  G.botProof={worlds:w.length,who:pistes.size};
  stopBot();
  startVerite(w[0].L);
}
function botStep(){
  const P=S.p;
  if(!G.bgoal){
    if(S.fin)return stopBot();
    const goals=botGoals();
    if(!goals.length)return botAccuse();
    let found=null;
    for(const g of goals){const p=pathTo(g.o);if(p&&(!found||p.length<found.p.length))found={g,p}}
    if(!found)for(const g of botKeys()){const p=pathTo(g.o);if(p&&(!found||p.length<found.p.length))found={g,p}}
    if(!found){G.botStuck=(G.botStuck||0)+1;if(G.botStuck>3)return stopBot();return}
    G.bgoal=found.g;G.bpath=found.p;G.bi=0;G.blife=0;if(found.g.o.kind==='suspect')found.g.o.hold=2000;
  }
  const n=G.bpath[G.bi];
  if(!n){botAct(G.bgoal);G.bvx=G.bvy=0;return}
  const dx=n[0]*TS+8-P.x,dy=n[1]*TS+11-P.y;
  if(Math.abs(dx)<3&&Math.abs(dy)<3){G.bi++;return}
  G.bvx=Math.abs(dx)>=3?Math.sign(dx):0;G.bvy=Math.abs(dy)>=3?Math.sign(dy):0;
  if(++G.blife>1200)G.bgoal=null;
}

  LB.sel=0;lbCentre();lbPanneau();
}
function lbCentre(){const k=$('lb-c'),r=k.getBoundingClientRect(),f=Math.min(r.width/(MW*TS),r.height/(MH*TS));LB.z=f>=1?Math.floor(f):f*.98;LB.cx=(MW*TS-r.width/LB.z)/2;LB.cy=(MH*TS-r.height/LB.z)/2}
function lbInterface(){
  const st=document.createElement('style');st.textContent='#lb-c{width:100%;height:100%;display:block;touch-action:none;min-width:0;min-height:0;cursor:grab}#lb .ed-corps{overflow:hidden}';document.head.appendChild(st);
  const e=document.createElement('div');e.id='lb';e.className='ed';document.body.appendChild(e);
  e.innerHTML=`<header class="ed-barre">
    <b style="color:#ffd23f">Labo des personnages</b><span class="petit">— essai, pas branché au jeu</span>
    <select id="lb-lv">${LEVELS.map((l,i)=>`<option value="${i}">${i+1}. ${esc(l.nom)}</option>`).join('')}</select>
    <span class="ed-groupe"><button data-lb="nouvelle">Autre enquête</button><button data-lb="mode">Mode : normal</button></span>
    <span class="ed-groupe"><button data-lb="pause">Pause</button>${[1,2,4,8].map(v=>`<button data-lb="vit" data-v="${v}">×${v}</button>`).join('')}</span>
    <span class="ed-groupe"><button data-lb="noir">Coupure</button><button data-lb="joueur">Joueur (souris)</button><button data-lb="chemins">Chemins</button><button data-lb="places">Places</button></span>
    <label class="ed-couleur" style="gap:6px">Hasard <input type="range" id="lb-hasard" min="0" max="1" step=".05" value="${LB.hasard}" style="width:90px"></label>
  </header>
  <div class="ed-corps"><canvas id="lb-c"></canvas><aside id="lb-p" class="ed-panneau"></aside></div>
  <footer id="lb-etat" class="ed-etat"></footer>`;
  $('lb-lv').value=LB.lv;
  $('lb-lv').addEventListener('change',x=>{LB.lv=+x.target.value;lbMonde()});
  $('lb-hasard').addEventListener('input',x=>{LB.hasard=+x.target.value;if(LB.ia)LB.ia.options.hasard=LB.hasard});
  e.addEventListener('click',x=>{const b=x.target.closest('button');if(!b)return;const a=b.dataset.lb;
    if(a==='nouvelle'){LB.graine=1000+Math.floor(Math.random()*8999);lbMonde()}
    if(a==='mode'){LB.mode=LB.mode?null:'expert';b.textContent='Mode : '+(LB.mode?'expert':'normal');lbMonde()}
    if(a==='pause')LB.pause=!LB.pause;if(a==='vit')LB.vit=+b.dataset.v;
    if(a==='noir'){LB.noir=!LB.noir;LB.ia.options.noir=LB.noir}
    if(a==='joueur'){LB.joueur=!LB.joueur;if(!LB.joueur)LB.ia.options.joueur=null}
    if(a==='chemins')LB.chemins=!LB.chemins;if(a==='places')LB.places=!LB.places;
    if(a==='perso'){LB.sel=+b.dataset.v}
    lbBoutons();lbPanneau()});
  e.addEventListener('input',x=>{const t=x.target;if(t.dataset.trait&&LB.ia){LB.ia.agents[LB.sel].traits[t.dataset.trait]=+t.value}});
  const k=$('lb-c');let pan=null;
  k.addEventListener('pointerdown',x=>{const p=lbCarte(x),A=LB.ia.agents,i=A.findIndex(a=>Math.hypot(a.x-p.x,a.y-12-p.y)<12);if(i>=0){LB.sel=i;lbPanneau();return}pan={sx:x.clientX,sy:x.clientY,cx:LB.cx,cy:LB.cy};k.setPointerCapture(x.pointerId)});
  k.addEventListener('pointermove',x=>{LB.souris=lbCarte(x);if(pan){LB.cx=pan.cx-(x.clientX-pan.sx)/LB.z;LB.cy=pan.cy-(x.clientY-pan.sy)/LB.z}});
  k.addEventListener('pointerup',()=>{pan=null});
  k.addEventListener('wheel',x=>{x.preventDefault();const r=k.getBoundingClientRect(),px=x.clientX-r.left,py=x.clientY-r.top,mx=px/LB.z+LB.cx,my=py/LB.z+LB.cy;LB.z=Math.max(.3,Math.min(8,LB.z*(x.deltaY<0?1.25:.8)));LB.cx=mx-px/LB.z;LB.cy=my-py/LB.z},{passive:false});
}
const lbCarte=x=>{const r=$('lb-c').getBoundingClientRect();return{x:(x.clientX-r.left)/LB.z+LB.cx,y:(x.clientY-r.top)/LB.z+LB.cy}};
function lbBoutons(){document.querySelectorAll('#lb [data-lb]').forEach(b=>{const a=b.dataset.lb;b.setAttribute('aria-pressed',a==='pause'?LB.pause:a==='vit'?+b.dataset.v===LB.vit:a==='noir'?LB.noir:a==='joueur'?LB.joueur:a==='chemins'?LB.chemins:a==='places'?LB.places:false)})}
function lbPanneau(){
  const e=$('lb-p'),ia=LB.ia;if(!e||!ia)return;const a=ia.agents[LB.sel];
  e.innerHTML=`<div class="ed-boutons">${ia.agents.map((b,i)=>`<button data-lb="perso" data-v="${i}" class="${i===LB.sel?'pris':''}">${esc(b.nom)}${b.coupable?' ★':''}</button>`).join('')}</div>
    <h3>${esc(a.nom)}${a.coupable?' <span class="petit">(coupable)</span>':''}</h3><div id="lb-direct"></div>
    <p class="petit">Caractère (glisse pour le changer en direct)</p>
    <div class="ed-champs">${Object.keys(a.traits).map(t=>`<label>${t}<input type="range" min="0" max="1" step=".05" value="${a.traits[t]}" data-trait="${t}"></label>`).join('')}</div>`;
}
function lbDirect(){
  const e=$('lb-direct'),ia=LB.ia;if(!e||!ia)return;const a=ia.agents[LB.sel],ac=a.action;
  const barre=(n,v)=>`<div style="display:grid;grid-template-columns:70px 1fr 34px;gap:6px;align-items:center;font-size:12px"><span>${n}</span><span style="background:#2a2540;height:8px;border-radius:3px"><i style="display:block;height:8px;border-radius:3px;width:${Math.round(v*100)}%;background:${v>.7?'#e86a4a':v>.4?'#e8c040':'#58c06a'}"></i></span><span>${Math.round(v*100)}</span></div>`;
  e.innerHTML=`<p><b>${ac?ia.IA_ACTIONS[ac.type].nom:'…'}</b>${ac&&ac.phase==='aller'?' <span class="petit">(en route)</span>':''}${a.assis?' <span class="petit">(assis)</span>':''}</p>
    ${Object.entries(a.besoins).map(([k,v])=>barre(k,v)).join('')}
    <p class="petit">Ce qu'il a envisagé : ${(a.notes||[]).map(([t,n])=>`${ia.IA_ACTIONS[t].nom} ${n}`).join(' · ')}</p>`;
}
function lbDessine(){
  const k=$('lb-c'),dpr=devicePixelRatio||1,r=k.getBoundingClientRect(),cw=Math.round(r.width*dpr),ch=Math.round(r.height*dpr);if(k.width!==cw||k.height!==ch){k.width=cw;k.height=ch}
  const g=k.getContext('2d'),s=LB.z*dpr,ia=LB.ia;g.setTransform(1,0,0,1,0,0);g.fillStyle='#07060f';g.fillRect(0,0,cw,ch);
  g.setTransform(s,0,0,s,-LB.cx*s,-LB.cy*s);g.imageSmoothingEnabled=false;g.drawImage(G.map,0,0);
  Object.values(W.doors).forEach(d=>{const ouv=d.lock===null,col=ouv?null:'#c8a040',cle=[d.v,d.style,false,col,d.num].join();
    if(d.v)g.drawImage(G.portes[cle]||(G.portes[cle]=doorVArt(d.style,false,col)),d.x*TS,d.y*TS);
    else{g.drawImage(G.portes[cle]||(G.portes[cle]=doorArt(d.style,false,col,d.num)),0,0,32,29,d.x*TS,(d.y+1)*TS+3,32,29);const c2='h'+cle;g.drawImage(G.portes[c2]||(G.portes[c2]=doorTopArt(d.style,false,col)),d.x*TS,d.y*TS)}});
  if(LB.places)ia.spots.forEach(p=>{g.fillStyle=p.pris!==null?'rgba(255,210,63,.55)':p.type==='lumiere'?'rgba(255,240,150,.25)':'rgba(120,200,255,.3)';g.fillRect(p.x*TS+4,p.y*TS+4,8,8)});
  const L=[...W.furn.map(f=>({y:(f.y+f.h)*TS,d:()=>g.drawImage(G.furn[f.id],f.x*TS-1,(f.y+f.h)*TS-SH[f.name]-1)})),
    ...ia.agents.map((a,i)=>({y:a.assis?a.y+3:a.y,d:()=>{
      const bouge=a.action&&a.action.phase==='aller',fr=bouge?(LB.tick>>3)&3:0;
      g.fillStyle='rgba(8,6,24,.4)';g.fillRect(Math.round(a.x-6),Math.round(a.y-1),12,3);
      g.drawImage(LB.sheets[i],fr*20,a.dir*30,20,30,Math.round(a.x-10),Math.round(a.y-27+(a.assis?2:0)),20,30);
      if(i===LB.sel){g.strokeStyle='#ffd23f';g.lineWidth=1/LB.z;g.strokeRect(Math.round(a.x-11),Math.round(a.y-29),22,32)}
      if(a.bulle){g.fillStyle='#fff8e4';g.fillRect(Math.round(a.x-5),Math.round(a.y-38),10,7);g.fillStyle='#2a2418';g.fillRect(Math.round(a.x-3),Math.round(a.y-35),1,1);g.fillRect(Math.round(a.x),Math.round(a.y-35),1,1);g.fillRect(Math.round(a.x+3),Math.round(a.y-35),1,1)}
      if(a.coupable){g.fillStyle='#e8504a';g.fillRect(Math.round(a.x+7),Math.round(a.y-30),2,2)}
    }}))].sort((p,q)=>p.y-q.y);
  L.forEach(o=>o.d());
  if(LB.chemins)ia.agents.forEach((a,i)=>{if(!a.chemin||!a.chemin.length)return;g.strokeStyle=i===LB.sel?'rgba(255,210,63,.9)':'rgba(140,220,255,.45)';g.lineWidth=1.2/LB.z*2;g.beginPath();g.moveTo(a.x,a.y-3);a.chemin.forEach(([x,y])=>g.lineTo(x*TS+8,y*TS+8));g.stroke()});
  // noms et actions au-dessus des têtes
  g.font=`${Math.max(4,10/LB.z)}px system-ui`;g.textAlign='center';
  ia.agents.forEach(a=>{const t=a.nom+' · '+(a.action?ia.IA_ACTIONS[a.action.type].nom:'…');const w=g.measureText(t).width;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(a.x-w/2-2/LB.z,a.y-46-11/LB.z,w+4/LB.z,13/LB.z);g.fillStyle='#fff3d6';g.fillText(t,a.x,a.y-46)});
  if(LB.noir){g.setTransform(1,0,0,1,0,0);g.fillStyle='rgba(4,3,14,.55)';g.fillRect(0,0,cw,ch)}
  if(LB.joueur&&LB.souris){g.setTransform(s,0,0,s,-LB.cx*s,-LB.cy*s);g.strokeStyle='#ffd23f';g.lineWidth=2/LB.z;g.beginPath();g.arc(LB.souris.x,LB.souris.y,10,0,7);g.stroke()}
}
function lbBoucle(){
  requestAnimationFrame(lbBoucle);if(!LB.ia)return;
  if(!LB.pause)for(let i=0;i<LB.vit;i++){LB.ia.options.joueur=LB.joueur&&LB.souris?{x:LB.souris.x,y:LB.souris.y}:null;LB.ia.pas();LB.tick++}
  lbDessine();if(LB.tick%15===0){lbDirect();const ia=LB.ia,T={};ia.agents.forEach(a=>{for(const[k,v]of Object.entries(a.stats))T[k]=(T[k]||0)+v});const S=Object.values(T).reduce((x,y)=>x+y,0)||1;
    $('lb-etat').innerHTML=`<span class="msg">${Math.round(LB.tick/60)} s simulées</span><span>${Object.entries(T).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k==='marche'?'Marcher':ia.IA_ACTIONS[k].nom} ${Math.round(v/S*100)} %`).join(' · ')}</span>`}
}
$('hud').hidden=true;$('accueil').hidden=true;lbInterface();lbMonde();lbBoutons();requestAnimationFrame(lbBoucle);

</script>
